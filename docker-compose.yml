version: '3.8'

services:
  okami-designs-api:
    build: .
    container_name: okami-designs-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Persist writable runtime data only (tools catalog, analytics, uploads).
      # For production images, prefer not bind-mounting the whole repo over /app.
      - ./files:/app/files
    working_dir: /app
    command: npm start
    restart: unless-stopped
    # Optional: for local/CLI deploys with a real .env file (cp .env.example .env).
    # Skipped harmlessly when absent (e.g. Portainer Git-stack deploys), which is
    # why the vars that matter are also listed explicitly below via ${...}
    # substitution — Portainer's stack "Environment variables" feed those directly.
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - ADMIN_SESSION_MAX_AGE_MS=${ADMIN_SESSION_MAX_AGE_MS:-1800000}
      - OKAMI_CORS_ALLOWED_ORIGINS=${OKAMI_CORS_ALLOWED_ORIGINS:-}
    networks:
      - okami-designs-network

  # Optional edge proxy. Not required if Cloudflare Tunnel (or another reverse
  # proxy) talks directly to okami-designs-api:3000.
  # Note: nginx.conf uses root /var/www/okami-designs and proxy_pass to the
  # Docker service hostname okami-designs-api — paths are container-oriented.
  okami-designs-web:
    image: nginx:alpine
    container_name: okami-designs-website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/okami-designs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - okami-designs-network
    depends_on:
      - okami-designs-api
    profiles:
      - with-nginx

networks:
  okami-designs-network:
    driver: bridge
